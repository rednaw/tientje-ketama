services:
  app:
    image: ${IMAGE:-}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tientje_ketama}
      UPLOADS_DIR: /app/uploads
      PUBLIC_SIMPLE_ANALYTICS_DOMAIN: tientjeketama.nl
      PORT: "3000"
      BODY_SIZE_LIMIT: "20M"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - traefik
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.priority: "1"
      traefik.http.routers.app.rule: "Host(`dev.tientjeketama.nl`) || Host(`prod.tientjeketama.nl`)"
      traefik.http.routers.app.entrypoints: "websecure"
      traefik.http.routers.app.tls.certresolver: "letsencrypt"
      traefik.http.routers.app.middlewares: "app-headers@file,app-buffering@file,app-permissions@docker"
      traefik.http.services.app.loadbalancer.server.port: "3000"
      traefik.http.middlewares.app-permissions.headers.customResponseHeaders.Permissions-Policy: "accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tientje_ketama}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER:-postgres}\""]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  default:
    name: tientje-ketama-network
  traefik:
    external: true

volumes:
  uploads:
  postgres_data:
